name: Fetch OSM trail data
on:
  push:
    branches: [demo-tiles]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Query OpenStreetMap (Overpass) for Hatfield-McCoy trails
        run: |
          mkdir -p osm
          Q='[out:json][timeout:180];
          (
            relation["route"]["name"~"Hatfield",i](37.15,-82.6,38.5,-81.1);
            relation["operator"~"Hatfield",i](37.15,-82.6,38.5,-81.1);
            way["operator"~"Hatfield",i](37.15,-82.6,38.5,-81.1);
            way["name"~"Hatfield|HMT",i]["highway"](37.15,-82.6,38.5,-81.1);
            way["atv"="designated"](37.15,-82.6,38.5,-81.1);
          );
          out tags geom;'
          for host in overpass-api.de overpass.kumi.systems; do
            curl -sS --fail -m 300 -A "TrailTracker" --data-urlencode "data=$Q" "https://$host/api/interpreter" -o osm/hmt.json && break
          done
          ls -la osm
          python3 - <<'PY'
          import json, collections
          d=json.load(open("osm/hmt.json"))
          els=d["elements"]
          c=collections.Counter(e["type"] for e in els); print(c)
          keys=collections.Counter(k for e in els for k in e.get("tags",{}))
          print(keys.most_common(40))
          for e in els[:40]: print(e["type"], e.get("tags"))
          PY
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add osm
          git commit -m "OSM trail data"
          git push
