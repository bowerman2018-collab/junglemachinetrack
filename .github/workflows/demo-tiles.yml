name: Fetch demo tiles
on:
  push:
    branches: [demo-tiles]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Download a small patch of USGS topo and imagery tiles around Gilbert, WV
        run: |
          python3 - <<'PY'
          import math, os, urllib.request
          def tx(lon,z): return int((lon+180)/360*2**z)
          def ty(lat,z):
              r=math.radians(lat); return int((1-math.log(math.tan(r)+1/math.cos(r))/math.pi)/2*2**z)
          box=(37.585,37.645,-81.905,-81.825)
          srcs={"topo":"USGSTopo","sat":"USGSImageryTopo"}
          for name,svc in srcs.items():
              for z in (12,13,14,15):
                  for x in range(tx(box[2],z),tx(box[3],z)+1):
                      for y in range(ty(box[1],z),ty(box[0],z)+1):
                          url=f"https://basemap.nationalmap.gov/arcgis/rest/services/{svc}/MapServer/tile/{z}/{y}/{x}"
                          p=f"demo-tiles/{name}/{z}/{x}/{y}"
                          os.makedirs(os.path.dirname(p),exist_ok=True)
                          req=urllib.request.Request(url,headers={"User-Agent":"TrailTracker demo"})
                          open(p,"wb").write(urllib.request.urlopen(req,timeout=30).read())
          PY
          du -sh demo-tiles
      - name: Commit tiles
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add demo-tiles
          git commit -m "Demo tiles"
          git push
