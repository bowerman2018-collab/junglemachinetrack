name: Computer version

# Checks the computer (web) version and publishes it to GitHub Pages:
# https://bowerman2018-collab.github.io/junglemachinetrack/
on:
  push:
    branches: [main]
    paths: ["web/**", "Tests/TrailImportCheck/**", ".github/workflows/web.yml"]
  pull_request:
    paths: ["web/**", "Tests/TrailImportCheck/**", ".github/workflows/web.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the decoder, trail importer and route finder
        run: node web/test/check.mjs

  publish:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Stamp the version so computers pick up the update
        run: |
          sed -i "s/const VERSION = \"v1\";/const VERSION = \"${GITHUB_SHA::7}\";/" web/sw.js
          rm -rf web/test
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
